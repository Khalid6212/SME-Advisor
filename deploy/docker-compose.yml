# Production stack. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Postgres is not published to the host — only the API reaches it, over the
# internal network. Caddy is the sole public surface.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sme_advisor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sme} -d ${POSTGRES_DB:-sme_advisor}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Defaults to production, which refuses to start without SMTP and object
      # storage — both are needed before anyone signs in for real. Set
      # NODE_ENV=development explicitly for a staging box that has neither yet;
      # magic links then print to the container log instead of being emailed.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-sme}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sme_advisor}
      APP_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL}
      API_ORIGIN: ${PUBLIC_URL}/api
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Asserts this database is in-Kingdom. The API refuses to start in
      # production if this is left at `development` (D11a).
      DATA_RESIDENCY: ${DATA_RESIDENCY:-development}
      SMTP_URL: ${SMTP_URL}
      MAIL_FROM: ${MAIL_FROM:-SME Advisor <no-reply@localhost>}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      # Only used until object storage is configured. Documents on a container
      # filesystem do not survive a rebuild — the API refuses to start in
      # production without S3 config, so this is a safety net, not a plan.
      - storage:/app/api/.storage

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    # Builds static assets into a volume Caddy serves; nothing runs at runtime.
    command: ["true"]
    volumes:
      - webroot:/out
    entrypoint: ["/bin/sh", "-c", "cp -r /srv/. /out/ && echo 'assets published'"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - webroot:/srv:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  storage:
  webroot:
  caddydata:
  caddyconfig:
